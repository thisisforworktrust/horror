<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreadForge - Browser Horror Engine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1>DreadForge</h1>
        <div class="toolbar-actions">
          <button id="btn-play">Play</button>
          <button id="btn-stop" disabled>Stop</button>
          <button id="btn-add-room">Add Room</button>
          <button id="btn-add-light">Add Flicker Light</button>
          <button id="btn-add-enemy">Add Stalker</button>
          <button id="btn-save">Save Scene</button>
          <button id="btn-load">Load Scene</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel">
          <h2>Hierarchy</h2>
          <ul id="hierarchy"></ul>
        </aside>

        <section class="viewport-wrap">
          <canvas id="viewport"></canvas>
        </section>

        <aside class="panel">
          <h2>Inspector</h2>
          <div id="inspector-empty">Select an object to edit its transform.</div>
          <form id="inspector" hidden>
            <label>Name <input id="entity-name" type="text" /></label>
            <h3>Position</h3>
            <label>X <input id="pos-x" type="number" step="0.1" /></label>
            <label>Y <input id="pos-y" type="number" step="0.1" /></label>
            <label>Z <input id="pos-z" type="number" step="0.1" /></label>
            <h3>Rotation (deg)</h3>
            <label>X <input id="rot-x" type="number" step="1" /></label>
            <label>Y <input id="rot-y" type="number" step="1" /></label>
            <label>Z <input id="rot-z" type="number" step="1" /></label>
            <h3>Scale</h3>
            <label>X <input id="scale-x" type="number" step="0.1" /></label>
            <label>Y <input id="scale-y" type="number" step="0.1" /></label>
            <label>Z <input id="scale-z" type="number" step="0.1" /></label>
          </form>
        </aside>
      </main>

      <footer class="statusbar" id="status">Ready. Build your nightmare.</footer>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
